<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Owl Feed">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Owl Feed</title>
<style>
:root{
  --bg:#000; --bg2:#16181c; --bg3:#202327; --text:#e7e9ea; --dim:#71767b; --line:#2f3336;
  --blue:#1d9bf0; --pink:#f91880; --green:#00ba7c; --gold:#e2b719; --red:#f4212e; --orange:#ffd400;
  --gry:#eb4650; --sly:#2fa05c; --rav:#4d7fe8; --huf:#f2c14e; --staff:#a08cd0; --ghost:#8aa6bd; --press:#c678a6; --min:#c0577f;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --navh:calc(53px + var(--sab));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input,textarea{font:inherit;color:var(--text)}
svg{display:block}
#app{position:fixed;inset:0}

/* ---------- top bar (home) ---------- */
#topbar{position:fixed;left:0;right:0;top:0;z-index:10;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .22s ease}
#topbar.hide{transform:translateY(-110%)}
.tb-row{height:53px;margin-top:var(--sat);display:flex;align-items:center;padding:0 16px}
.tb-row .side{width:56px;display:flex}
.tb-row .side.r{justify-content:flex-end}
#tbAvatar .av{width:32px;height:32px;font-size:12px}
.tb-logo{flex:1;display:flex;justify-content:center;color:var(--text)}
.tb-logo svg{width:27px;height:27px}
#conn{width:7px;height:7px;border-radius:50%;background:transparent;align-self:center}
#conn.off{background:var(--red)}
#homeTabs{display:flex;border-bottom:1px solid var(--line)}
#homeTabs button{flex:1;text-align:center;padding:14px 0 12px;font-weight:500;font-size:15px;color:var(--dim);position:relative}
#homeTabs button.on{color:var(--text);font-weight:700}
#homeTabs button.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:56px;height:4px;border-radius:4px;background:var(--blue)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(var(--navh) + 20px)}
.screen.active{display:block}
#scr-home{padding-top:calc(var(--sat) + 97px)}
.shead{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:var(--sat)}
.shead .ttl{font-size:20px;font-weight:800;padding:12px 16px}
.subtabs{display:flex;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;text-align:center;padding:14px 0 12px;color:var(--dim);font-weight:500;position:relative}
.subtabs button.on{color:var(--text);font-weight:700}
.subtabs button.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:48px;height:4px;border-radius:4px;background:var(--blue)}

/* ---------- posts ---------- */
.post{padding:10px 16px 2px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.post:active{background:#080808}
.ctx{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;font-weight:700;padding:0 0 2px 26px;margin-bottom:-2px}
.ctx svg{width:14px;height:14px}
.prow{display:flex;gap:10px}
.gutter{display:flex;flex-direction:column;align-items:center;flex:none}
.gutter .tl{width:2px;flex:1;background:var(--line);margin-top:4px;border-radius:2px}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;position:relative}
.av.sm{width:20px;height:20px;font-size:8px}
.av.md{width:32px;height:32px;font-size:12px}
.av.xl{width:72px;height:72px;font-size:26px}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.pbody{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:4px;min-width:0}
.meta .who{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.chk{width:16px;height:16px;flex:none}
.hdot{width:7px;height:7px;border-radius:50%;flex:none}
.hd{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.meta .more{margin-left:auto;color:var(--dim);padding:2px 0 2px 10px;flex:none}
.meta .more svg{width:19px;height:19px}
.rto{color:var(--dim);font-size:14px;margin-top:1px}
.rto .lnk{color:var(--blue)}
.txt{margin-top:1px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.txt .lnk{color:var(--blue)}
.post.big .txt{font-size:17px;line-height:1.4}
.quote{margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;overflow:hidden}
.quote .qmeta{display:flex;align-items:center;gap:4px;font-size:14px;min-width:0}
.quote .qmeta .nm{font-size:14px}
.quote .qtxt{margin-top:2px;font-size:14px;color:var(--text);white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.verdict{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.v-viral{color:var(--gold);border-color:#5c4a0a}
.v-good,.v-won{color:var(--green);border-color:#0e4d36}
.v-flop,.v-lost,.v-ratioed{color:var(--pink);border-color:#67123a}
.v-controversial{color:#ff8a3d;border-color:#6b3a14}
.actrow{display:flex;align-items:center;margin:4px 0 2px;color:var(--dim);max-width:460px}
.actrow .a{display:flex;align-items:center;gap:3px;font-size:13px;padding:6px 0;flex:1}
.actrow .a svg{width:18.5px;height:18.5px}
.actrow .grp{display:flex;align-items:center;gap:14px;flex:none}
.actrow .grp .a{flex:none;padding:6px 0}
.a.c-like.on{color:var(--pink)}
.a.c-rt.on{color:var(--green)}
.a.c-bmk.on{color:var(--blue)}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.typing{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;margin-top:5px}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots i{width:4px;height:4px;border-radius:50%;background:var(--dim);animation:bnc 1s infinite}
.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,80%,100%{opacity:.3}40%{opacity:1}}
.empty{padding:48px 32px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:23px;font-weight:800;margin-bottom:6px}

/* detail page */
.dmeta{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.dmeta .names{flex:1;min-width:0}
.dmeta .names .nmrow{display:flex;align-items:center;gap:4px}
.dmeta .names .hd{display:block}
.dtxt{padding:2px 16px 10px;font-size:19px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.dtxt .lnk{color:var(--blue)}
.dtime{padding:4px 16px 12px;color:var(--dim);font-size:14px;border-bottom:1px solid var(--line)}
.dstats{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim);flex-wrap:wrap}
.dstats b{color:var(--text)}
.dacts{border-bottom:1px solid var(--line);padding:2px 10px}
.replybar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:8px 14px calc(var(--sab) + 8px);border-top:1px solid var(--line);background:var(--bg)}
.replybar input{flex:1;padding:10px 16px;border-radius:999px;border:1px solid transparent;background:var(--bg3);outline:none;min-width:0;font-size:15px}
.replybar input:focus{border-color:var(--blue);background:var(--bg)}
.replybar .send{color:#fff;background:var(--blue);font-weight:700;padding:8px 16px;border-radius:999px;flex:none}
.replybar .send:disabled{opacity:.5}

/* ---------- bottom nav ---------- */
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:.5px solid var(--line);padding-bottom:var(--sab)}
#bottomnav button{flex:1;display:grid;place-items:center;height:52px;color:var(--text);position:relative}
#bottomnav svg{width:26px;height:26px}
.badge{position:absolute;top:7px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;display:none;place-items:center;border:1px solid #000}
.badge.show{display:grid}

#fab{position:fixed;right:16px;bottom:calc(var(--navh) + 16px);width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.55);z-index:11}
#fab svg{width:24px;height:24px}
#fab.hidden{display:none}

/* new posts pill */
#newPill{position:fixed;top:calc(var(--sat) + 108px);left:50%;transform:translate(-50%,-56px);opacity:0;background:var(--blue);color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(29,155,240,.4);z-index:12;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
#newPill.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#newPill .avs{display:flex}
#newPill .avs .av{width:24px;height:24px;font-size:9px;border:2px solid var(--blue);margin-left:-8px}
#newPill .avs .av:first-child{margin-left:0}
#newPill svg{width:16px;height:16px}

/* pull to refresh */
#ptr{height:0;display:grid;place-items:center;overflow:hidden;color:var(--dim)}
#ptr svg{width:22px;height:22px;transition:transform .2s}
#ptr.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- pages stack ---------- */
#pages{position:fixed;left:0;right:0;top:0;bottom:var(--navh);z-index:20;pointer-events:none}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;pointer-events:auto;transform:translateX(100%);transition:transform .22s ease;will-change:transform}
.page.in{transform:none}
.page.drag{transition:none}
.pghead{display:flex;align-items:center;gap:18px;padding:calc(var(--sat) + 6px) 14px 6px;min-height:calc(var(--sat) + 50px);background:rgba(0,0,0,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;z-index:2}
.pghead .back{width:36px;height:36px;display:grid;place-items:center;margin-left:-8px;border-radius:50%;flex:none}
.pghead .back:active{background:var(--bg2)}
.pghead .back svg{width:21px;height:21px}
.pghead .pgtitle{font-size:19px;font-weight:800;line-height:1.15;min-width:0}
.pghead .pgtitle .sub{display:block;font-size:12.5px;font-weight:400;color:var(--dim)}
.pgscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
.page.hasbar .pgscroll{padding-bottom:80px}

/* profile */
.banner{height:116px;background:var(--bg2);background-size:cover;background-position:center}
.pfhead{padding:0 16px 12px;border-bottom:1px solid var(--line)}
.pftop{display:flex;justify-content:space-between;align-items:flex-start}
.pftop .av.xl{margin-top:-38px;border:4px solid var(--bg)}
.pillbtn{margin-top:10px;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--text);color:#000;flex:none}
.pillbtn.outline{background:transparent;color:var(--text);border:1px solid var(--dim)}
.pfname{margin-top:8px;display:flex;align-items:center;gap:4px;font-size:20px;font-weight:800}
.pfname .chk{width:19px;height:19px}
.pfhd{color:var(--dim);font-size:15px;display:flex;align-items:center;gap:8px}
.fchip{font-size:11px;background:var(--bg3);color:var(--dim);border-radius:4px;padding:1px 5px;font-weight:500}
.pfbio{margin-top:10px;font-size:15px;white-space:pre-wrap}
.pfline{margin-top:10px;display:flex;align-items:center;gap:14px;color:var(--dim);font-size:14px;flex-wrap:wrap}
.pfline .hl{display:flex;align-items:center;gap:5px}
.pfline svg{width:17px;height:17px}
.pfcounts{margin-top:10px;display:flex;gap:18px;font-size:14px;color:var(--dim)}
.pfcounts b{color:var(--text)}
.gstats{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--dim)}
.gstats .hypew{flex:1;min-width:70px}
.gstats .hbar{height:5px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:4px}
.gstats .hbar div{height:100%;background:var(--blue);border-radius:3px;transition:width .5s}
.gstats b{color:var(--text);font-weight:700}
.gstats .gs{white-space:nowrap}

/* user rows / explore / lists */
.urow{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.urow:active{background:#080808}
.urow .uinfo{flex:1;min-width:0}
.urow .uinfo .meta{gap:4px}
.urow .sub{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--text);color:#000;flex:none}
.fbtn.following{background:transparent;color:var(--text);border:1px solid var(--dim)}
.sect{padding:14px 16px 8px;font-size:19px;font-weight:800}
.trow{padding:10px 16px;cursor:pointer}
.trow:active{background:#080808}
.trow .k{color:var(--dim);font-size:13px}
.trow .t{font-weight:700;font-size:15px;margin:1px 0}
.trow .n{color:var(--dim);font-size:13px}
.searchwrap{padding:6px 16px 10px;display:flex;align-items:center;gap:12px}
.searchwrap .av{cursor:pointer}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:999px;padding:9px 14px}
.sbox svg{width:16px;height:16px;color:var(--dim);flex:none}
.sbox input{flex:1;background:none;border:0;outline:none;font-size:15px;min-width:0}
.chips{display:flex;gap:8px;padding:4px 16px 8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text)}
.showmore{display:block;width:100%;padding:14px 16px;color:var(--blue);font-size:15px;border-bottom:1px solid var(--line)}

/* notifications */
.nrow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.nrow.unread{background:#0a0d10}
.nrow:active{background:#080808}
.nrow .nicon{width:30px;flex:none;display:flex;justify-content:flex-end}
.nrow .nicon svg{width:26px;height:26px}
.nrow .nbody{flex:1;min-width:0}
.nrow .navs{display:flex;gap:6px;margin-bottom:6px}
.nrow .t{font-size:15px}
.nrow .t b{font-weight:700}
.nrow .ex{color:var(--dim);font-size:14px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .tm{color:var(--dim);font-size:12.5px;margin-top:3px}

/* house cup */
.cup{padding:4px 16px 14px}
.cup .h{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 4px}
.cup .b{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden}
.cup .b div{height:100%;transition:width .6s;border-radius:5px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.rk .n{width:22px;text-align:center;color:var(--dim);font-weight:700;flex:none}
.rk .f{margin-left:auto;font-weight:700}

/* settings/menu rows */
.mrow{display:flex;align-items:center;gap:16px;padding:15px 20px;font-size:17px;font-weight:600;width:100%}
.mrow:active{background:var(--bg2)}
.mrow svg{width:22px;height:22px;color:var(--text)}
.mrow.danger{color:var(--red)}
.mrow.danger svg{color:var(--red)}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(91,112,131,.4);z-index:39;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:76%;max-width:300px;background:var(--bg);z-index:40;transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;border-right:1px solid var(--line)}
#drawer.show{transform:none}
.dr-top{padding:calc(var(--sat) + 16px) 20px 14px;border-bottom:1px solid var(--line)}
.dr-top .nmrow{display:flex;align-items:center;gap:4px;margin-top:10px;font-weight:800;font-size:17px}
.dr-top .hd{font-size:14px}
.dr-counts{display:flex;gap:16px;margin-top:10px;font-size:14px;color:var(--dim)}
.dr-counts b{color:var(--text)}
.dr-menu{flex:1;overflow-y:auto;padding:6px 0}

/* ---------- compose ---------- */
#compose{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#compose.show{display:flex;animation:slideup .22s ease}
@keyframes slideup{from{transform:translateY(8%);opacity:.6}to{transform:none;opacity:1}}
.chead{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 14px 8px}
.chead .cancel{font-size:15px;padding:8px 4px}
.cpost{background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px}
.cpost:disabled{opacity:.5}
.cbody{flex:1;display:flex;gap:10px;padding:10px 16px;overflow-y:auto}
.cbody textarea{flex:1;width:100%;min-height:120px;background:none;border:0;outline:none;resize:none;font-size:19px;line-height:1.4;color:var(--text);padding-top:6px}
.cbody textarea::placeholder{color:var(--dim)}
.cmain{flex:1;min-width:0}
.cfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px calc(var(--sab) + 12px);border-top:1px solid var(--line)}
.cfoot .hint{margin-right:auto;color:var(--blue);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{position:relative;width:26px;height:26px}
.ring svg{width:26px;height:26px;transform:rotate(-90deg)}
.ring .rtrack{stroke:var(--line);fill:none;stroke-width:2.5}
.ring .rbar{stroke:var(--blue);fill:none;stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset .1s}
.ring.warn .rbar{stroke:var(--orange)}
.ring.over .rbar{stroke:var(--red)}
.ring .rnum{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--dim)}
.ring.warn .rnum{color:var(--orange)}
.ring.over .rnum{color:var(--red)}

/* ---------- bottom action sheet ---------- */
#sheetWrap{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(91,112,131,.4)}
#sheetWrap.show{display:flex}
#sheet{width:100%;background:var(--bg);border-radius:18px 18px 0 0;padding:10px 0 calc(var(--sab) + 10px);animation:up .2s ease}
@keyframes up{from{transform:translateY(30%)}to{transform:none}}
#sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 8px}
#sheet .cancelbtn{margin:8px 16px 0;width:calc(100% - 32px);text-align:center;padding:13px;border:1px solid var(--line);border-radius:999px;font-weight:700}

/* ---------- waking splash (free hosting sleeps; the first visit after a nap takes a while) ---------- */
#waking{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#waking.show{display:flex}
#waking .owl{width:56px;height:56px;color:var(--text);animation:wk 2.4s ease-in-out infinite}
@keyframes wk{0%,100%{transform:translateY(0) rotate(-4deg);opacity:.8}50%{transform:translateY(-8px) rotate(4deg);opacity:1}}
#waking h2{font-size:22px;font-weight:800;margin:18px 0 6px}
#waking p{color:var(--dim);font-size:15px;line-height:1.4;max-width:300px;margin:0 0 18px}
#waking button{background:var(--text);color:#000;border:0;border-radius:999px;padding:10px 22px;font-weight:700;font-size:15px}
#waking .dots span{display:inline-block;animation:wd 1.2s infinite}
#waking .dots span:nth-child(2){animation-delay:.2s}#waking .dots span:nth-child(3){animation-delay:.4s}
@keyframes wd{0%,60%,100%{opacity:.2}30%{opacity:1}}
/* ---------- signup ---------- */
#signup{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#signup.show{display:flex}
#signup .owl{width:44px;height:44px;margin-bottom:14px;color:var(--text)}
#signup .card{width:100%;max-width:400px}
#signup h1{font-size:26px;font-weight:800;margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px}
.field input:focus{border-color:var(--blue)}
.houses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.houses button{padding:12px 8px;border-radius:8px;border:1.5px solid var(--line);font-weight:700;text-align:center}
.houses button.on{border-color:var(--blue);background:#0a171f}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
#joinBtn{width:100%;padding:14px;border-radius:999px;background:var(--text);color:#000;font-weight:700;font-size:16px;text-align:center}
#joinBtn:disabled{opacity:.5}

/* skeletons */
.sk{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.sk .c{width:40px;height:40px;border-radius:50%;background:var(--bg2);flex:none}
.sk .ln{flex:1}
.sk .b{height:12px;border-radius:6px;background:var(--bg2);margin-bottom:8px}
.sk .b.w60{width:60%}.sk .b.w90{width:90%}.sk .b.w40{width:40%}
.sk .c,.sk .b{animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* @mention autocomplete */
#mention{position:fixed;left:8px;right:8px;z-index:95;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 14px rgba(255,255,255,.12);display:none;overflow:hidden;max-width:520px;margin:0 auto}
#mention.show{display:block}
#mention .mi{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}
#mention .mi.sel,#mention .mi:active{background:var(--bg2)}
#mention .mi .av{width:36px;height:36px;font-size:13px;pointer-events:none}
#mention .mi .mt{min-width:0;flex:1}
#mention .mi .mn{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
#mention .mi .mn .nm{max-width:60vw}
#mention .mi .mh{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mention .mi .mtag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px;flex:none}
/* avatars are illustrated SVGs or uploaded photos, set as background images */
.av{background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#1c1f23;font-size:0;border:1px solid rgba(255,255,255,.08)}
.av.xl{border:4px solid var(--bg)}
/* messages */
.ttlrow{display:flex;align-items:center;justify-content:space-between;padding-right:12px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--bg2)}
.iconbtn svg{width:22px;height:22px}
.pfbtns{display:flex;align-items:center;gap:8px;margin-top:10px}
.pfbtns .pillbtn{margin-top:0}
.pfbtns .iconbtn{border:1px solid var(--dim);width:36px;height:36px}
.crow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.crow:active{background:#080808}
.crow .cinfo{flex:1;min-width:0}
.crow .meta .who{overflow:hidden}
.cprev{color:var(--dim);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.crow.unread .cprev{color:var(--text);font-weight:600}
.udot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.page.chat{background:var(--bg)}
.chathd{display:flex;align-items:center;gap:10px;min-width:0}
.chathd .av{width:32px;height:32px;flex:none}
.chathd .pgtitle{font-size:16px;min-width:0}
.nmrow2{display:flex;align-items:center;gap:4px}
.chatscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 14px;display:flex;flex-direction:column;gap:3px}
.bub{max-width:78%;padding:9px 14px;border-radius:19px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:#2f3336;border-bottom-left-radius:6px}
.bub .lnk{color:inherit;text-decoration:underline}
.ctime{align-self:center;color:var(--dim);font-size:12px;margin:12px 0 4px}
.mtime{font-size:11.5px;color:var(--dim);margin:2px 6px 8px;align-self:flex-start}
.mtime.me{align-self:flex-end}
.mtime .seen{color:var(--text)}
.rx{align-self:flex-start;margin:-6px 0 4px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:13px}
.rx.me{align-self:flex-end;margin:-6px 10px 4px 0}
.bub.typingb{padding:12px 16px}
.bub.typingb .dots{display:inline-flex;gap:4px}
.bub.typingb .dots i{width:6px;height:6px;border-radius:50%;background:#9aa0a6;animation:bnc 1s infinite}
.bub.typingb .dots i:nth-child(2){animation-delay:.15s}.bub.typingb .dots i:nth-child(3){animation-delay:.3s}
.chatbar{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg)}
.chatbar textarea{flex:1;background:var(--bg3);border:1px solid transparent;border-radius:20px;padding:10px 15px;outline:none;resize:none;max-height:110px;font-size:15px;line-height:1.3;min-width:0}
.chatbar textarea:focus{border-color:var(--blue);background:var(--bg)}
.csend{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.csend svg{width:19px;height:19px}
.csend:disabled{opacity:.45}
/* edit profile + cropper */
.epbanner{height:124px;background-size:cover;background-position:center;position:relative}
.epavrow{padding:0 16px;margin-top:-36px;position:relative;pointer-events:none}
.epavrow .epav{pointer-events:auto}
.epbanner .epcam{top:10px;bottom:auto}
.epav{width:76px;height:76px;position:relative}
.epcam{position:absolute;right:10px;bottom:8px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.62);display:grid;place-items:center}
.epcam svg{width:20px;height:20px}
.epcam.sm{right:-6px;bottom:-4px;width:30px;height:30px;border:2px solid var(--bg)}
.epcam.sm svg{width:15px;height:15px}
#cropper{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#cropper.show{display:flex}
.crhead{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 10px) 14px 10px;font-weight:700}
.crstage{flex:1;display:grid;place-items:center}
.crframe{position:relative;overflow:hidden;outline:2px solid var(--blue);touch-action:none;background:#111}
.crframe.round{border-radius:50%}
.crframe canvas{display:block;touch-action:none;cursor:grab}
.crctl{display:flex;align-items:center;gap:12px;padding:12px 24px calc(var(--sab) + 22px);color:var(--dim);font-size:13px}
.crctl input{flex:1}
.post.grp{border-bottom:0}
.story{display:inline-block;margin-top:6px;font-size:11.5px;color:#ff8a5c;border:1px solid #6b3a14;border-radius:999px;padding:2px 9px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.hot{border-left:3px solid #ff6a3d;background:linear-gradient(90deg,rgba(255,106,61,.10),transparent 70%)}
.trow.hot .k{color:#ff8a5c}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 70px);transform:translate(-50%,16px);background:var(--blue);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:92%;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

  if (L.hat === 'witch') s += `<ellipse cx="50" cy="31" rx="29" ry="6" fill="${L.hatColor}"/><path d="M33 31 Q40 15 53 1 Q54 17 67 31Z" fill="${L.hatColor}"/><path d="M34 29 Q50 33 66 29" stroke="${pal[2]}" stroke-width="2.2" fill="none"/>`;
  if (L.hat === 'witch' && has('stars')) s += '<g fill="#f6d65a"><circle cx="48" cy="20" r="1.4"/><circle cx="56" cy="14" r="1.1"/><circle cx="45" cy="27" r="1"/></g>';
  if (L.hat === 'jester') s += '<path d="M32 30 Q28 12 18 12 Q26 20 36 22Z" fill="#c0392b"/><path d="M68 30 Q72 12 82 12 Q74 20 64 22Z" fill="#2fa05c"/><path d="M34 31 Q50 20 66 31Z" fill="#f2c14e"/><circle cx="18" cy="12" r="2.6" fill="#f2c14e"/><circle cx="82" cy="12" r="2.6" fill="#f2c14e"/>';
  if (ghost) s += '</g>';
  return s + '</svg>';
}

// every avatar is a CSS class with a background image, so feeds stay light however many cards repeat the same face
const avSheet = (() => { const st = document.createElement('style'); document.head.appendChild(st); return st.sheet; })();
const avMap = new Map();
function avClass(u) {
  const url = u.avatarUrl;
  const key = url ? 'u:' + url : 'g:' + u.handle + '|' + u.house + '|' + u.kind;
  let c = avMap.get(key);
  if (!c) {
    c = 'avc' + avMap.size; avMap.set(key, c);
    const img = url ? 'url("' + url.replace(/"/g, '') + '")' : 'url("data:image/svg+xml,' + encodeURIComponent(avatarSVG(u)) + '")';
    try { avSheet.insertRule('.' + c + '{background-image:' + img + '}', avSheet.cssRules.length); } catch (_) {}
  }
  return c;
}
function avatar(u, cls = '') {
  if (!u) return '';
  return `<div class="av ${cls} ${avClass(u)}" data-user="${u.id}">${u.kind==='player'&&onlineSet.has(u.id)?'<span class="dot"></span>':''}</div>`;
}
const hdot = u => `<span class="hdot" title="${esc(u.house)}" style="background:${HC[u.house]||'var(--staff)'}"></span>`;
function linkify(text) {
  let s = esc(text);
  // only real accounts become links; unknown handles stay plain text
  s = s.replace(/(^|[\s(>])@([a-z0-9_.]{2,20})/gi, (m, pre, h) => {
    const tail = (h.match(/\.+$/) || [''])[0];
    const hh = h.slice(0, h.length - tail.length);
    return byHandle(hh) ? `${pre}<span class="lnk" data-handle="${hh.toLowerCase()}">@${hh}</span>${tail}` : m;
  });
  s = s.replace(/(^|[\s(>])#(\w{2,40})/g, (m, pre, t) => `${pre}<span class="lnk" data-tag="${esc(t)}">#${t}</span>`);
  return s;
}

/* ---------------- feed ---------------- */
function feedItems() {
  const pend = new Set(pending);
  const all = Object.values(posts).filter(p => !p.parentId && !pend.has(p.id));
  const items = [];
  const followSet = new Set([me.id, ...me.following]);
  for (const p of all) {
    const reps = (p.repostedBy||[]).filter(r => r.id === me.id || followSet.has(r.id) || users[r.id]?.kind === 'player');
    const rep = reps.sort((a,b) => b.ts - a.ts)[0];
    if (feedMode === 'following') {
      const repFollowed = (p.repostedBy||[]).filter(r => followSet.has(r.id)).sort((a,b) => b.ts - a.ts)[0];
      if (followSet.has(p.authorId)) items.push({ p, ts: Math.max(p.ts, repFollowed?repFollowed.ts:0), rep: repFollowed && repFollowed.ts > p.ts ? repFollowed : null });
      else if (repFollowed) items.push({ p, ts: repFollowed.ts, rep: repFollowed });
    } else {
      items.push({ p, ts: rep && rep.ts > p.ts ? rep.ts : p.ts, rep: rep && rep.ts > p.ts ? rep : null });
    }
  }
  // bot-vs-bot threads fill the feed, but anything involving a player stays on top: player posts get a long head start, threads a player joined or mentioned me in a shorter one
  const involved = new Set();
  for (const p of Object.values(posts)) if (users[p.authorId]?.kind === 'player' || (p.mentions || []).includes(me.id)) involved.add(p.rootId || p.id);
  for (const it of items) it.key = it.ts + (users[it.p.authorId]?.kind === 'player' ? 60 * 60e3 : involved.has(it.p.id) ? 40 * 60e3 : 0);
  return items.sort((a,b) => b.key - a.key).slice(0, 180);
}
function renderFeed() {
  if (!me) return;
  let html = '';
  let items = feedItems();
  if (feedMode === 'foryou') {
    const cutoff = Date.now() - 30 * 60000;
    const pinned = [];
    for (const fid of me.following) {
      if (users[fid]?.kind !== 'player') continue;
      const latest = items.filter(it => it.p.authorId === fid && !it.rep).sort((a,b) => b.p.ts - a.p.ts)[0];
      if (latest && latest.p.ts > cutoff) pinned.push(latest);
    }
    const pinSet = new Set(pinned.map(it => it.p.id));
    items = items.filter(it => !pinSet.has(it.p.id));
    html = pinned.map(it => postHTML(it.p, { pinned: true })).join('');
  }
  // bot scenes show as a conversation: the root plus the latest two replies, joined by the thread line
  const kids = {};
  for (const p of Object.values(posts)) if (p.sceneId && p.parentId) (kids[p.rootId || p.parentId] = kids[p.rootId || p.parentId] || []).push(p);
  html += items.map(it => {
    const o = it.rep ? { ctx: it.rep.id === me.id ? 'You reposted' : `${users[it.rep.id]?.name || '?'} reposted` } : {};
    const prev = (kids[it.p.id] || []).sort((a, b) => a.ts - b.ts).slice(-2);
    if (!prev.length) return postHTML(it.p, o);
    return postHTML(it.p, { ...o, connector: true, cls: 'grp' }) + prev.map((r, i) => postHTML(r, { showReplyTo: true, connector: i < prev.length - 1, cls: i < prev.length - 1 ? 'grp' : '' })).join('');
  }).join('');
  if (!html) html = feedMode === 'following'
    ? '<div class="empty"><b>Welcome to Following</b>Posts from people you follow — players and castle accounts — show up here. Find people in Search.</div>'
    : '<div class="empty"><b>Quiet castle</b>Post something to wake everyone up.</div>';
  $('#feedList').innerHTML = html;
}
function renderPill() {
  const pill = $('#newPill');
  if (!pending.length || tab !== 'home' || !rootVisible()) { pill.classList.remove('show'); return; }
  const authors = [...new Set(pending.map(id => posts[id]?.authorId).filter(Boolean))].slice(0, 3);
  $('#pillAvs').innerHTML = authors.map(id => avatar(users[id])).join('');

}
function flushPending() {
  if (!pending.length) return;
  pending = [];
  renderFeed(); renderPill();
  $('#scr-home').scrollTo({ top: 0, behavior: 'smooth' });
}
$('#newPill').onclick = flushPending;

/* ---------------- notifications ---------------- */
function groupNotifs(list) {
  const groups = [], byKey = {};
  for (const n of list) {
    const key = (n.type === 'like' || n.type === 'repost') && n.postId ? n.type + ':' + n.postId : n.id;
    if (byKey[key]) { byKey[key].others.push(n); continue; }
    const g = { n, others: [] }; byKey[key] = g; groups.push(g);
  }
  return groups;
}
function notifFilter(n) {
  if (ntab === 'verified') return users[n.fromId]?.kind === 'char';
  return true;
}
function renderNotifs() {
  if (ntab === 'mentions') { // every post that @mentions me, newest first
    const list = Object.values(posts).filter(p => (p.mentions || []).includes(me.id) && p.authorId !== me.id).sort((a,b) => b.ts - a.ts).slice(0, 100);
    $('#notifList').innerHTML = list.length ? list.map(p => postHTML(p, { showReplyTo: true })).join('')
      : '<div class="empty"><b>Nothing to see here — yet</b>When someone @mentions you, their post shows up here.</div>';
    return;
  }
  const list = notifs.filter(notifFilter).slice(0, 200);
  const groups = groupNotifs(list);
  const ICN = { rumour: I.starN, exposed: I.boltN, like: I.heartN, repost: I.rtN, follow: I.userN, verdict: I.boltN, duel: I.boltN, prophet: I.starN, join: I.userN, friend_post: I.owlN, friend_viral: I.starN, system: I.owlN, mention: I.userN, reply: I.reply, quote: I.rtN, trending: I.boltN, unfollow: I.userN, milestone: I.starN };
  $('#notifList').innerHTML = groups.length ? groups.map(g => {
    const n = g.n;
    const from = users[n.fromId];
    const extra = g.others.length;
    const avs = [n, ...g.others].map(x => users[x.fromId]).filter(Boolean).slice(0, 6);
    let text;
    if (n.type === 'like' && from) text = `<b>${esc(from.name)}</b>${extra ? ` and ${extra} other${extra>1?'s':''}` : ''} liked your post`;
    else if (n.type === 'repost' && from) text = `<b>${esc(from.name)}</b>${extra ? ` and ${extra} other${extra>1?'s':''}` : ''} reposted your post`;

let pickKind = null;
async function onPickFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('Pick an image file');
  const blob = await cropImage(file, pickKind).catch(() => null);
  if (!blob) return;

  socket.emit('upload', { kind: pickKind, mime: blob.type, data: buf }, r => toast(r && r.ok ? (pickKind === 'avatar' ? 'Profile photo updated' : 'Banner updated') : (r?.error || 'Upload failed')));
}
// pan + zoom inside a fixed frame (1:1 avatar, 3:1 banner), then export a downsized WebP
function cropImage(file, kind) {
  return new Promise((resolve, reject) => {
    const avatarMode = kind === 'avatar';
    const outW = avatarMode ? 400 : 1200, outH = avatarMode ? 400 : 400;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.onload = () => {
      const root = $('#cropper'), frame = $('#crFrame'), cv = $('#crCanvas'), zoom = $('#crZoom'), ctx = cv.getContext('2d');
      const W = Math.min(window.innerWidth - 32, 360), H = Math.round(W * outH / outW);
      frame.style.width = W + 'px'; frame.style.height = H + 'px'; frame.classList.toggle('round', avatarMode);
      cv.width = W; cv.height = H;
      $('#crTitle').textContent = avatarMode ? 'Crop photo' : 'Crop banner';
      const base = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      let z = 1, ox = (W - img.naturalWidth * base) / 2, oy = (H - img.naturalHeight * base) / 2;
      zoom.value = '1';
      const clampPos = () => { const s = base * z; ox = Math.min(0, Math.max(W - img.naturalWidth * s, ox)); oy = Math.min(0, Math.max(H - img.naturalHeight * s, oy)); };
      const draw = () => { clampPos(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); const s = base * z; ctx.drawImage(img, ox, oy, img.naturalWidth * s, img.naturalHeight * s); };
      const setZoom = (nz, cx = W / 2, cy = H / 2) => { const k = nz / z; ox = cx - (cx - ox) * k; oy = cy - (cy - oy) * k; z = nz; zoom.value = String(z); draw(); };
      draw();
      const pts = new Map(); let pinch = 0;
      cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; };
      cv.onpointermove = e => {
        if (!pts.has(e.pointerId)) return;
        const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
        if (pts.size === 1) { ox += e.clientX - prev[0]; oy += e.clientY - prev[1]; draw(); }
        else if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) setZoom(Math.min(4, Math.max(1, z * d / pinch))); pinch = d; }
      };
      const up = e => { pts.delete(e.pointerId); pinch = 0; };
      cv.onpointerup = up; cv.onpointercancel = up;
      cv.onwheel = e => { e.preventDefault(); setZoom(Math.min(4, Math.max(1, z * (e.deltaY < 0 ? 1.08 : 0.93)))); };
      zoom.oninput = () => setZoom(+zoom.value);
      const close = v => { root.classList.remove('show'); URL.revokeObjectURL(url); resolve(v); };
      $('#crCancel').onclick = () => close(null);
      $('#crApply').onclick = () => {
        const out = document.createElement('canvas'); out.width = outW; out.height = outH;
        const k = outW / W, s = base * z;
        out.getContext('2d').drawImage(img, ox * k, oy * k, img.naturalWidth * s * k, img.naturalHeight * s * k);
        out.toBlob(b1 => {
          if (b1 && b1.size > 1.9 * 1024 * 1024) out.toBlob(b2 => close(b2), 'image/jpeg', 0.8); else close(b1);
        }, 'image/webp', 0.85);
      };
      root.classList.add('show');
    };
    img.src = url;
  });
}

  if (qEl) { e.stopPropagation(); openThread(qEl.dataset.quote); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    e.stopPropagation();
    const host = act.closest('[data-post]');
    const p = host && posts[host.dataset.post];
    if (!p) return;
    const kind = act.dataset.act;
    if (kind === 'like') toggleLike(p, act);
    else if (kind === 'rt') repostMenu(p);
    else if (kind === 'bmk') toggleBookmark(p.id);
    else if (kind === 'share') sharePost(p);
    else if (kind === 'menu') postMenu(p);
    else if (kind === 'reply') {
      const top = pageEntry();
      if (!(top && top.type === 'thread' && top.data === p.id)) openThread(p.id);
      setTimeout(() => { const pg = pageEntry(); const inp = pg && pg.el.querySelector('.rin'); inp && inp.focus(); }, 300);
    }

  if (e.target.closest('#clearRec')) { recents = []; try { localStorage.setItem('owl_recent','[]'); } catch(_){} renderExplore(); return; }
  const setRow = e.target.closest('[data-set]');
  if (setRow) {
    if (setRow.dataset.set === 'install') toast(/iphone|ipad/i.test(navigator.userAgent) ? 'Safari → Share → Add to Home Screen' : 'Chrome menu ⋮ → Install app');
    if (setRow.dataset.set === 'logout') openSheet([{ icon: I.logout, label: 'Log out of Owl Feed?', danger: true, cb: () => { try { localStorage.removeItem('owl_token'); } catch (_) {} location.reload(); } }]);

  if (e.target.closest('#epSave')) {
    const name = $('#epName').value.trim(), bio = $('#epBio').value.trim();
    socket.emit('profile', { name, bio }, r => { if (r && r.ok) { toast('Profile saved'); uiBack(); } else toast(r?.error || 'Failed'); });
    return;
  }
  const pt = e.target.closest('.ptabs [data-pt]');
  if (pt) {
    e.stopPropagation();
    const top = pageEntry();
    if (top && top.type === 'profile') { top.ptab = pt.dataset.pt; rerenderPages(); }
    else { myPtab = pt.dataset.pt; renderMyProfile(); }
    return;
  }
  const uEl = e.target.closest('[data-user]');
  if (uEl) { e.stopPropagation(); openProfile(uEl.dataset.user); return; }
  const pEl = e.target.closest('[data-post]');
  if (pEl && !e.target.closest('.trow')) {
    const top = pageEntry();
    if (!(top && top.type === 'thread' && top.data === pEl.dataset.post)) openThread(pEl.dataset.post);
    return;
  }
  const tr = e.target.closest('.trow');
  if (tr) { if (tr.dataset.post) openThread(tr.dataset.post); else if (tr.dataset.q) { $('#q').value = tr.dataset.q; saveRecent(tr.dataset.q); renderExplore(); } return; }
  const nEl = e.target.closest('[data-notif]');
  if (nEl) {
    const n = notifs.find(x => x.id === nEl.dataset.notif); if (!n) return;
    if (n.postId && posts[n.postId]) openThread(n.postId);
    else if (n.fromId && users[n.fromId]) openProfile(n.fromId);
    return;
  }
});

}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitCompose); window.visualViewport.addEventListener('scroll', fitCompose); }
$('#compose').addEventListener('animationend', () => { if (mm) showMention(mm.el, mm.anchor); }); // re-measure once the sheet has finished sliding in

/* ---------------- @mention autocomplete ---------------- */
const mp = document.createElement('div'); mp.id = 'mention'; document.body.appendChild(mp);
let mm = null; // {el, anchor, tok, items, idx}
function mentionToken(el) {
  const pos = el.selectionStart ?? el.value.length;
  const m = el.value.slice(0, pos).match(/(^|[\s(])@([a-z0-9_.]{0,20})$/i);
  return m ? { q: m[2].toLowerCase(), start: pos - m[2].length - 1, end: pos } : null;
}
// people I follow and the other player first, then canon characters, then NPCs
function mentionCandidates(q) {
  const fl = new Set(me.following);
  const match = u => {
    const h = u.handle.toLowerCase(), n = u.name.toLowerCase();
    if (!q) return 1;
    if (h.startsWith(q)) return 4;
    if (n.split(/\s+/).some(w => w.startsWith(q))) return 3;
    return h.includes(q) || n.includes(q) ? 2 : 0;
  };
  const group = u => (u.kind === 'player' || fl.has(u.id)) ? 0 : u.kind === 'char' ? 1 : 2;
  return Object.values(users).filter(u => u.id !== me.id && match(u))
    .sort((a, b) => group(a) - group(b) || fl.has(b.id) - fl.has(a.id) || (b.kind === 'player') - (a.kind === 'player') || match(b) - match(a) || b.followers - a.followers)
    .slice(0, 6);
}
function hideMention() { mm = null; mp.classList.remove('show'); }
function showMention(el, anchor) {
  const tok = me && mentionToken(el);
  if (!tok) return hideMention();
  const items = mentionCandidates(tok.q);
  if (!items.length) return hideMention();
  const idx = mm && mm.el === el ? Math.min(mm.idx, items.length - 1) : 0;
  mm = { el, anchor, tok, items, idx };
  mp.innerHTML = items.map((u, i) => `<div class="mi${i === idx ? ' sel' : ''}" data-i="${i}">${avatar(u)}<div class="mt"><div class="mn"><span class="nm">${esc(u.name)}</span>${chk(u)}</div><div class="mh">@${esc(u.handle)}</div></div></div>`).join('');
  mp.classList.add('show');
  const r = anchor.getBoundingClientRect();
  mp.style.top = Math.max(4, r.top - mp.offsetHeight - 4) + 'px';
}
function pickMention(i) {
  if (!mm) return;
  const { el, tok, items } = mm, u = items[i];
  if (!u) return;
  const v = el.value, after = v.slice(tok.end).replace(/^ /, '');
  const ins = '@' + u.handle + ' ';
  el.value = v.slice(0, tok.start) + ins + after;
  const c = tok.start + ins.length;
  hideMention();
  el.focus(); el.setSelectionRange(c, c);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function wireMention(el, anchorFn) {
  const refresh = () => showMention(el, anchorFn());
  el.addEventListener('input', refresh);
  el.addEventListener('click', refresh);
  el.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) refresh(); });
  el.addEventListener('keydown', e => {
    if (!mm || mm.el !== el) return;
    const n = mm.items.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); mm.idx = (mm.idx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      mp.querySelectorAll('.mi').forEach((r, i) => r.classList.toggle('sel', i === mm.idx));
    } else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(mm.idx); }
    else if (e.key === 'Escape') { e.preventDefault(); hideMention(); }
  });
  el.addEventListener('blur', () => setTimeout(() => { if (mm && mm.el === el && document.activeElement !== el) hideMention(); }, 200));
}
mp.addEventListener('mousedown', e => e.preventDefault()); // keep the text field focused
mp.addEventListener('click', e => { e.stopPropagation(); const row = e.target.closest('.mi'); if (row) pickMention(+row.dataset.i); });
wireMention(cText, () => $('.cfoot'));
function updCount() {
  const len = cText.value.length, left = 280 - len;
  const ring = $('#cRing');
  ring.querySelector('.rbar').style.strokeDashoffset = String(RING_C * (1 - Math.min(1, len / 280)));
  ring.classList.toggle('warn', left <= 20 && left > 0);
  ring.classList.toggle('over', left <= 0);
  $('#cNum').textContent = left <= 20 ? left : '';
  $('#cPost').disabled = !cText.value.trim();
}
cText.addEventListener('input', updCount);
$('#fab').onclick = () => openCompose({ type: 'post' });
$('#cCancel').onclick = () => uiBack();
$('#cPost').onclick = () => {
  const text = cText.value.trim(); if (!text) return;
  $('#cPost').disabled = true;
  const done = r => {
    if (!r || !r.ok) { toast(r?.error || 'Failed to post'); updCount(); return; }
    cText.value = ''; buzz(15);
    goTab('home'); // clears compose and anything under it, back to the feed
    $('#scr-home').scrollTop = 0;
    tabScroll.home = 0;
  };
  if (composeMode.type === 'quote') socket.emit('quote', { postId: composeMode.id, text }, done);
  else socket.emit('post', { text }, done);
};

/* ---------------- signup ---------------- */
$('#suHouses').innerHTML = HOUSES.map(h => `<button data-h="${h}" style="color:${HC[h]}">${h}</button>`).join('');
$('#suHouses').onclick = e => { const b = e.target.closest('[data-h]'); if (!b) return; pickedHouse = b.dataset.h; $$('#suHouses button').forEach(x => x.classList.toggle('on', x === b)); };
$('#suHandle').addEventListener('input', e => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_.]/g, ''); });
$('#joinBtn').onclick = () => {
  $('#suErr').textContent = '';
  const name = $('#suName').value.trim(), handle = $('#suHandle').value.trim();
  if (!name || !handle) return ($('#suErr').textContent = 'Name and handle required');
  if (!pickedHouse) return ($('#suErr').textContent = 'Pick a house');
  $('#joinBtn').disabled = true;
  socket.emit('signup', { name, handle, house: pickedHouse, invite: $('#suInvite').value.trim() }, r => {
    $('#joinBtn').disabled = false;
    if (!r || !r.ok) return ($('#suErr').textContent = r?.error || 'Failed');
    token = r.token; try { localStorage.setItem('owl_token', token); } catch (_) {}
    $('#signup').classList.remove('show');
    init(r.init);
  });
};

/* ---------------- my profile tab ---------------- */
let myPtab = 'posts';
function renderMyProfile() {
  if (!me) return;
  $('#myProfile').innerHTML = `<div style="height:var(--sat)"></div>` + profileHTML(me, myPtab);
}

/* ---------------- render all ---------------- */
let rq = false;
function renderAll() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; doRenderAll(); }); }
function doRenderAll() {
  if (!me) return;
  me = users[me.id] || me;
  $('#tbAvatar').innerHTML = avatar(me, 'md');
  renderPill();
  if (tab === 'home') renderFeed();
  if (tab === 'explore') renderExplore();
  if (tab === 'notifs') renderNotifs();
  if (tab === 'profile') renderMyProfile();
  renderMsgs();
  const unread = notifs.filter(n => !n.read).length;
  const b = $('#nbadge'); b.textContent = unread > 99 ? '99+' : unread; b.classList.toggle('show', unread > 0);
  rerenderPages();
  if (drawerOpen) renderDrawer();
}

/* skeleton while loading */
function showSkeleton() {
  $('#feedList').innerHTML = Array(7).fill('<div class="sk"><div class="c"></div><div class="ln"><div class="b w60"></div><div class="b w90"></div><div class="b w40"></div></div></div>').join('');
}
showSkeleton();
renderNav();

/* ---------------- socket ---------------- */
function init(d) {
  me = d.me; users = {}; posts = {};
  d.users.forEach(u => users[u.id] = u);
  d.posts.forEach(p => posts[p.id] = p);
  notifs = d.notifs || []; trend = d.trend; onlineSet = new Set(d.online || []); activity = d.activity || {};
  bookmarks = new Set(d.me.bookmarks || []);
  events = d.events || [];
  convs = {}; (d.dms || []).forEach(c => { convs[c.id] = c; });
  pending = [];
  booted = true;
  if (!stack.length) bootRoute(); // first load: open the page the URL points at
  renderAll();
}
/* ---------------- waking splash + retry ---------------- */
let wakeTimer = null, retryTimer = null, tries = 0, everConnected = false;
function showWaking(msg) {
  if (msg) $('#wakingMsg').textContent = msg;
  wakingEl.classList.add('show');
}
function hideWaking() { wakingEl.classList.remove('show'); clearTimeout(wakeTimer); clearTimeout(retryTimer); tries = 0; }
function retrySoon() { // socket.io only retries by itself when the transport fails; "server says it is still waking" and "server closed us" need a manual nudge
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (!socket.connected) { tries++; socket.connect(); } }, Math.min(1000 + tries * 700, 5000));
}
$('#wakingBtn').onclick = () => { tries = 0; socket.connect(); };
wakeTimer = setTimeout(() => { if (!socket.connected) showWaking(); }, 2500); // first visit after a nap
socket.on('connect_error', () => {
  showWaking(tries > 6 ? 'Still waking up. Cold starts can take a minute, hang tight. We keep trying for you.' : null);
  retrySoon();
});
socket.on('config', c => { $('#suInviteField').style.display = c && c.inviteRequired ? '' : 'none'; });
socket.on('connect', () => {
  everConnected = true; hideWaking();
  $('#conn').classList.remove('off');
  if (!token) { $('#signup').classList.add('show'); return; }
  socket.emit('hello', { token }, r => {
    if (r && r.ok) { $('#signup').classList.remove('show'); init(r.init); }
    else { try { localStorage.removeItem('owl_token'); } catch (_) {} token = null; $('#signup').classList.add('show'); }
  });
});
socket.on('disconnect', reason => {
  $('#conn').classList.add('off');
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(() => { if (!socket.connected) showWaking('Lost the castle for a moment. Reconnecting…'); }, 4000);
  if (reason === 'io server disconnect') retrySoon(); // server closed it on purpose (e.g. it is restarting)
});
socket.on('post:new', p => {
  posts[p.id] = p;
  const a = users[p.authorId];
  // buffer top-level posts from others behind the "Show N posts" pill; replies & own posts flow straight in
  if (me && !p.parentId && p.authorId !== me.id) {
    pending.push(p.id);
    renderPill();
    if (a && a.kind === 'player' && me.following.includes(a.id) && tab !== 'home') toast(`${a.name} posted`, () => openThread(p.id));
    rerenderPages();
    if (tab === 'explore') renderExplore();
  } else renderAll();
});
socket.on('post:update', u => { const p = posts[u.id]; if (!p) return; Object.assign(p, u); renderAll(); });
socket.on('post:delete', d => {
  for (const id of (d.ids || [])) { delete posts[id]; bookmarks.delete(id); pending = pending.filter(x => x !== id); }
  const top = pageEntry();
  if (top && top.type === 'thread' && !posts[top.data]) uiBack();
  renderAll(); renderPill();
});
socket.on('user:new', u => { users[u.id] = u; renderAll(); });
socket.on('user:update', u => { users[u.id] = { ...users[u.id], ...u }; if (me && u.id === me.id) me = users[u.id]; renderAll(); });
socket.on('notif', n => {
  notifs.unshift(n);
  if (tab === 'notifs') { n.read = true; socket.emit('readNotifs'); }
  else if (['verdict','duel','prophet','friend_viral','follow','join','mention','quote','trending','unfollow','milestone','rumour','exposed'].includes(n.type) || users[n.fromId]?.kind === 'player') {
    toast(n.text, () => n.postId && posts[n.postId] ? openThread(n.postId) : n.fromId && users[n.fromId] && openProfile(n.fromId));
    buzz([20, 40, 20]);
  }
  renderAll();
});
socket.on('dm:msg', ({ convId, members, msg }) => {
  const c = ensureConv(convId);
  c.members = members;
  if (!c.msgs.some(m => m.id === msg.id)) c.msgs.push(msg);
  c.lastTs = msg.ts; c.read = c.read || {}; c.read[msg.from] = msg.ts;
  if (msg.from !== me.id) {
    typingFrom[convId] = false;
    if (chatOpen(convId)) markConvRead(c);
    else { const u = users[msg.from]; if (u) toast(u.name + ': ' + msg.text.slice(0, 60), () => pushPage('dm', convId)); buzz([20, 40, 20]); }
  }
  renderAll();
});
socket.on('dm:read', ({ convId, by, ts }) => { const c = convs[convId]; if (!c) return; c.read = c.read || {}; c.read[by] = Math.max(c.read[by] || 0, ts); renderAll(); });
socket.on('dm:react', ({ convId, msgId, reactions }) => { const c = convs[convId], m = c && c.msgs.find(x => x.id === msgId); if (m) { m.reactions = reactions; renderAll(); } });
socket.on('dm:typing', ({ convId, from, typing }) => {
  if (from === me.id) return;
  typingFrom[convId] = !!typing;
  clearTimeout(typingTimers[convId]);
  if (typing) typingTimers[convId] = setTimeout(() => { typingFrom[convId] = false; renderAll(); }, 6000);
  renderAll();
});
socket.on('activity', a => { if (a.label) activity[a.postId] = a.label; else delete activity[a.postId]; renderAll(); });
socket.on('presence', ids => { onlineSet = new Set(ids); renderAll(); });
socket.on('events', list => { events = list || []; if (tab === 'explore') renderExplore(); });
socket.on('trend', t => { trend = t; toast(`New trend: ${t.title}`); renderAll(); });

setInterval(() => renderAll(), 30000);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
})();
</script>
